[versions]
agp = "8.13.1"
desugar_jdk_libs = "2.1.5"
firebaseBom = "34.6.0"
kotlin = "2.2.21"
kotlinxSerializationJson = "1.9.0"
ksp = "2.2.21-2.0.4" # KSP version aligned with Kotlin
googleGms = "4.4.4" # Google Services plugin version
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.11.00"
